<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            /* display: flex; */
            /* justify-content: space-between; */
            align-items: center;
            background-color: aliceblue;
            text-align: center;
            margin:200px;
            height: 300px;
            width: 400px;

        }
    </style>
</head>
<body>
    <!-- <fieldset> -->
    <div class="box">
        <h1 style="color: blue; font-weight: bold;">facebook</h1>
        <h4>Create a new Account<br/></h4>
        <p style="align-items: center;">Its quick</p>
        <br>
        <form>
        <input type="text" placeholder="First name"/>
        <input type="text" placeholder="Last name"/>
        <br>
        Date of Birth:
        <select value="Date">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
        
        </select>
        <select value="Mon">
            <option value="1">Jan</option>
            <option value="2">Feb</option>
            <option value="3">Mar</option>
            <option value="4">Apr</option>
            <option value="5">May</option>
            <option value="6">Jun</option>
            <option value="7">Jul</option>
            <option value="8">Aug</option>
            <option value="9">Sep</option>
            <option value="10">Oct</option>
            <option value="11">Nov</option>
            <option value="12">Dec</option>
        </select>
        <select value="Year">
            <option value="1">2005</option>
            <option value="2">2006</option>
            <option value="3">2007</option>
        </select>
        <br>
        Gender:
        <input type="checkbox">Female
        <input type="checkbox">Male
        <input type="checkbox">Custom
        <br>
        <input type="text" placeholder="Mobile or email"/>
        
        <br>
        <button>Create Account</button>
    </form>
    </div>

</body>
</html>
