<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <img src="officedesk.jpeg" width="200px" id="desk">
    <script>
        desk.style.position = "absolute";
        //giving absolute in order to move the position
        let b = document.body;
        let left = 0;
        b.onkeydown = (e) => {
            if(e.key=="ArrowDown"){
            left = left + 5;
            desk.style.top = left + "px";
            }

            else if(e.key=="ArrowRight"){
            left = left + 5;
            desk.style.left= left + "px";
            }
            else if(e.key=="ArrowLeft"){
            left = left + 5;
            desk.style.right= left + "px";
            }
            else if(e.key=="ArrowUp"){
            left = left + 5;
            desk.style.bottom= left + "px";
            }
        };


    </script>
</body>

</html>
